apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: container-workshop
spec:
  ingressClassName: example
  rules:
    - host: workshop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
